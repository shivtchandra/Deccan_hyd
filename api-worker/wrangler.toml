name = "heritage-api"
main = "dist/index.js"
no_bundle = true
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
# Reached through the site's Pages Function proxy (functions/api/[[path]].js).
workers_dev = true

[build]
command = "node build.mjs"

[observability]
enabled = true

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://heritage.mapmyhyd.com"
